symptom: 하네스 상태를 사람에게 보고해야 할 때, 감사 모드가 내놓는 L0~L5 값 하나로는 다음에 무엇을 고쳐야 하는지 알 수 없었고, 그 자리를 메우려고 만든 채점 기준이 세션 스크래치패드에만 존재해 다음 라운드에 사라질 상태였습니다.
evidence: |
  SKILL.md 19행의 감사 모드는 "L0~L5 중 하나를 판정하고, 없는 요소를 HE-* ID로 보고" 까지만 규정합니다.
  이 저장소는 요소가 대부분 존재하므로 결손 열거가 거의 비고, 남는 산출은 저장소 하나당 값 하나입니다.
  값 하나로는 HE-7 static analysis 와 HE-13 memory 중 어느 쪽을 먼저 보완할지 판정할 수 없습니다.
  이번 라운드에서 6축 채점 기준(P/E/X/G/R/D)을 새로 작성해 채점자 3명에게 배포했는데,
  그 기준 문서는 세션 임시 디렉터리에만 있었고 번들 어디에도 링크되지 않았습니다.
  같은 요청("하네스 어디가 약한지 보여줘")이 다시 오면 기준을 처음부터 다시 만들게 됩니다.
  D(문서 부패) 축을 추가할 때도 근거는 이 세션에서 실제로 관측된 문서-구현 불일치였습니다.
root_cause: 감사 모드가 "하네스가 있느냐"(성숙도)와 "어느 부분이 얼마나 약하냐"(요소별 강도) 두 질문을 하나로 묶어두었습니다. 앞의 질문만 절차화되어 있어 뒤의 질문에 답할 때마다 기준을 즉석에서 만들게 되고, 즉석에서 만든 기준은 어디에도 남지 않아 라운드 간 비교가 불가능했습니다.
fix: skills/harness-score/ 를 추가해 6축 채점 절차(SKILL.md)와 기준 정본(rubric.md)을 번들 자산으로 고정했습니다. 감사 모드에는 "성숙도 판정과 결손 열거까지가 범위" 라는 경계를 명시하고 정량 절반을 harness-score 로 넘겼습니다. skills 개수 표기 4종을 5종으로 갱신했습니다.
