# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-05-002
date: 2026-09-05
status: candidate
symptom: 가드와 게이트를 지탱하는 함수가 여러 곳에 복제되어 이미 갈라졌습니다. fallback_find_project_root 가 두 hook 에 그대로 복제되어 있고 common.sh 의 find_project_root 와 판정 규칙이 달랐습니다(-d .git vs -e .git → worktree 에서 루트를 놓침). tree fingerprint 도 common.sh 와 hook 에 각각 있어 한쪽만 고치면 지문이 영원히 어긋나 모든 종료가 막힙니다. eval.sh 는 계층 가중치와 점수 산출식을 JSON 출력용과 사람용 표 출력용으로 두 번 계산합니다.
evidence: 2차 코드 리뷰 16건 중 3건. harness/hooks/stop-verify-gate.sh 43-70·139-155 와 harness/hooks/guard-evaluation-tampering.sh 105-132 에 같은 함수 복제. harness/scripts/eval.sh 의 JSON 산출부와 사람용 표 출력부에 같은 식 두 벌. 커밋 4a7adc7 에서 -d/-e 불일치와 지문 불일치를 실제로 수정했습니다.
root_cause: hook 은 lib/common.sh 없이도 동작해야 한다는 요구 때문에 폴백을 자체 보유하는데, 그 폴백이 정본과 같은지 검사하는 수단이 없습니다. 복제본이 갈라져도 verify 가 통과합니다. eval.sh 의 이중 계산도 마찬가지로, 한쪽만 고치면 latest-eval.json 과 화면 출력이 달라지는데 아무것도 감지하지 못합니다.
fix: 이번에는 복제본을 손으로 맞추고 '한쪽을 고치면 반드시 다른 쪽도 고친다' 를 주석과 hooks/README.md 에 적었습니다. 이것은 EL-1 입니다. 근본 처방은 (1) hooks 공용 lib 추출 또는 (2) 복제된 함수의 동작이 일치하는지 비교하는 self-check 항목, (3) eval.sh 의 계층 계산을 배열에 한 번 담고 JSON 과 표를 그것에서 렌더링.
recurrence_risk: medium
harness_element: HE-11
proposed_harness_change: self-check 에 duplication 항목을 더해, hook 의 폴백 함수와 common.sh 정본이 같은 입력에 같은 출력을 내는지 실제로 실행해 비교합니다. 코드가 같은지가 아니라 동작이 같은지를 봅니다.
preferred_enforcement: test
trust: untrusted
regression_check: 폴백 중 하나를 일부러 어긋나게 만들면 verify 가 실패하고, 맞추면 통과하는지 확인합니다. hook 이 common.sh 없이 동작해야 한다는 요구를 깨지 않는지도 함께 봅니다.
