# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-05-003
date: 2026-09-05
status: validating
symptom: 커밋 직후 stop 게이트가 종료를 차단했습니다. 파일 내용은 하나도 바뀌지 않았고 git commit 이 HEAD 를 옮겼을 뿐인데 tree 지문이 달라졌습니다. 검증 → 커밋 → 종료 는 정상 작업 순서인데 그 순서로는 항상 차단됩니다.
evidence: 2026-09-05 세션. 커밋 7223486 직후 stop-verify-gate.sh 가 '검증 이후 작업 트리가 바뀌었습니다 (당시 지문 ec1fa975b759, 현재 61b5d896990f)' 로 exit 2. 직전 verify 는 5단계 전부 통과였고 커밋과 verify 사이에 편집이 없었습니다. 지문 정의는 lib/common.sh 의 harness_tree_fingerprint.
root_cause: 지문이 git rev-parse HEAD 와 git status --porcelain, git diff HEAD 를 함께 해시합니다. 셋 다 HEAD 를 기준으로 하므로 커밋 전후에 값이 전부 달라집니다. 커밋 전에는 HEAD=A, status 에 M 목록, diff 에 변경 내용이 있고, 커밋 후에는 HEAD=B, status 비어 있음, diff 비어 있음입니다. 작업 트리의 실제 내용은 동일한데 지문만 달라집니다. 지문이 '내용'이 아니라 '내용 + HEAD 기준 상대 표현'을 해시하고 있는 것이 원인입니다.
fix: harness_tree_fingerprint 를 커밋 불변으로 바꿨습니다. HEAD 기준 표현(rev-parse HEAD, status --porcelain, diff HEAD) 대신 작업 트리에 실제로 존재하는 파일의 "경로 + 내용 해시" 목록을 정렬해 해시합니다. 수정 없는 추적 파일은 git ls-files -s 의 index blob 해시를 그대로 쓰고(파일을 읽지 않아 빠르며 index 는 커밋으로 바뀌지 않습니다), 작업 트리가 index 와 다른 파일과 미추적 파일만 git hash-object 로 실제 내용을 해시합니다. 존재하지 않는 경로는 목록에서 제외해 삭제의 stage·commit 에도 불변입니다. lib/common.sh 정본과 stop-verify-gate.sh 폴백을 같은 정의로 맞췄습니다. 최초의 우회(커밋 뒤 verify 재실행)는 더 필요하지 않습니다. 
recurrence_risk: high
harness_element: HE-10
proposed_harness_change: 지문을 커밋 불변으로 만듭니다. HEAD 기준 상대 표현 대신 작업 트리 파일의 내용 해시를 직접 모읍니다(git ls-files 와 미추적 목록에 각각 git hash-object). 대형 저장소에서 hook 시간 예산을 넘길 수 있으므로 비용을 먼저 측정하고, 넘으면 커밋 직후 1회 면제 같은 다른 처방을 검토합니다.
preferred_enforcement: script
trust: untrusted
regression_check: '기준: 검증 → 커밋 → 종료 순서에서 게이트가 통과하고, 검증 → 파일 수정 → 종료 순서에서 여전히 차단해야 합니다. 후자가 깨지면 기각. 수천 파일 규모에서 계산 시간이 30초 hook 예산 안이어야 합니다. 결과(2026-09-05, 커밋 0c38af8): 임시 저장소 12개 시나리오 전부 통과 — 감지 5종(파일 수정, 같은 파일 재수정, 미추적 추가, 미추적 수정, 추적 파일 삭제), 불변 4종(git add, git commit, 삭제 stage, 삭제 commit), 원복 2종, 구현 일치 1종(common.sh 정본 == hook 폴백, c8d19df6). 실제 저장소 종단 확인: git add 후 게이트 exit 0, git commit 후 재검증 없이 exit 0, 파일 1줄 수정 후 exit 2, 되돌린 뒤 exit 0. 비용: 추적 125개 0.44초, 1000개 0.57초, 5000개 2.2초, 5000개+더티 20개 3.1초로 전부 예산 안. 기각 조건 미발생. PG-6 계층 비교(2026-09-05): 기준선 .harness/baseline-eval.json 은 변경 직전 커밋 0c38af8^ 을 별도 워크트리에서 평가해 고정했고, 변경 후는 .harness/latest-eval.json 입니다. 총점 100 → 100, 계층별 correctness 100 → 100, architecture 100 → 100, quality 100 → 100, behavior 100 → 100, performance null → null, subjective null → null. 낮아진 계층 없음. **PG-3 미충족**: 대표 task(REP-1~8)와 held-out task(HLD-1~5)는 새 세션에서 에이전트가 수행해야 하는 시나리오이고 eval.sh 의 단계 집계로는 대체되지 않습니다. 아직 실행하지 않았으므로 task ID 별 판정 근거가 없습니다. 그래서 promoted 로 올리지 않고 validating 에 둡니다. 2026-09-06 추가 (1) 대표 task 중 REP-1 을 판정했습니다. 근거 evaluation/runs/2026-09-05-REP-1.md, verdict pass. 워크트리 aa4d29b 에 미커밋으로 남아 있던 산출물이 cf6aebf 기준이고 그 커밋이 0c38af8 을 포함하므로 이 candidate 의 하네스에 대한 실행이며, 합격 기준 네 항목을 2026-09-06 에 다시 실행해 확인했습니다. (2) 나머지 대표 task 7건과 held-out 5건은 여전히 미판정입니다. 사유는 evaluation/runs/_worktree-findings.md 에 있습니다. (3) held-out 세트가 오염되었습니다. 2026-09-06 리뷰 세션이 evaluation/tasks/held-out.md 를 전문 읽은 뒤 하네스를 여덟 커밋 변경했고, 그 순서는 세트가 금지하는 것입니다. 이 candidate 의 held-out 판정은 같은 세션에서 수행하지 않습니다. 승격은 맥락이 없는 새 세션이 나머지 REP 와 held-out 을 수행한 뒤에만 가능합니다.'
