# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-05-004
date: 2026-09-05
status: candidate
symptom: 가드의 셸 명령 검사가 두 방향으로 틀립니다. 공백을 포함한 절대경로를 겨냥한 쓰기는 놓치고(미탐), 보호 대상 경로를 인용부호 안에 언급한 설명 문장은 차단합니다(오탐). 둘 다 대상 토큰을 정규식으로 근사하기 때문입니다.
evidence: 2026-09-05 라운드. JSON 이스케이프 수정 직후 측정했습니다. (1) 미탐 — Bash 페이로드의 command 가 리다이렉션으로 저장소 절대경로의 런타임 산출물을 겨냥할 때 exit 0. 경로에 공백이 있어 대상 추출이 첫 공백에서 잘립니다. 같은 대상을 상대경로로 쓰면 exit 2 로 정상 차단됩니다. (2) 오탐 — improvement-log.sh 를 부르는 명령의 인용된 인자 안에 보호 경로를 설명으로 적었더니 그 문자열이 리다이렉션 대상으로 읽혀 차단되었습니다. 실제 차단 메시지가 세션 로그에 남아 있습니다.
root_cause: 셸의 인용 규칙을 정규식으로 근사하고 있습니다. 따옴표 안의 공백과 인자 구분자인 공백을 구별하려면, 그리고 인용된 문자열 리터럴과 실제 리다이렉션 대상을 구별하려면 셸 파서가 필요합니다. hook 은 매 도구 호출마다 실행되므로 파서를 붙일 시간 예산이 없다고 보고 정규식을 택했는데, 그 근사가 양방향으로 틀립니다.
fix: 이번 라운드에서는 고치지 않았습니다. 원인이 JSON 이스케이프 결함(값 해석)과 다른 층(인자 토큰화)이고 CC-1 이 한 번에 하나를 요구합니다. 미탐 쪽은 상대경로 명령이 여전히 차단되어 가장 흔한 우회 경로는 막혀 있고, 오탐 쪽은 HARNESS_ALLOW_GUARDED_EDIT=1 로 넘길 수 있어 둘 다 즉시 차단 사유는 아닙니다.
recurrence_risk: medium
harness_element: HE-10
proposed_harness_change: 대상 추출을 정규식이 아니라 토큰 단위로 바꿉니다. 후보는 두 가지입니다. (1) 명령 문자열의 인용 상태를 한 글자씩 훑어 따옴표 밖의 리다이렉션 연산자 뒤 토큰만 대상으로 삼습니다. 순수 bash 로 가능하고 fork 가 늘지 않습니다. (2) 판정을 명령이 아니라 결과에 겁니다. PostToolUse 에서 보호 파일의 내용 해시가 바뀌었는지 보고 바뀌었으면 알립니다. 차단이 아니라 사후 검출이라 강제력은 낮지만 근사 오류가 없습니다.
preferred_enforcement: hook
trust: untrusted
regression_check: 대상 REP-3, REP-4, REP-8, HLD-5. 기준은 셋입니다. (1) 공백 포함 절대경로로 보호 대상을 겨냥한 쓰기가 차단될 것. (2) 보호 경로를 인용된 문자열 안에 언급하기만 하는 명령은 통과할 것. (3) 기존 차단 판정 전부가 유지되고 새 오탐이 생기지 않을 것. 더해서 가드 1회 실행이 1초 예산 안에 있을 것. 하나라도 어긋나면 기각합니다. 근거 파일은 .harness/baseline-eval.json 과 .harness/latest-eval.json 입니다.
owner: unassigned
expires: 2026-12-31
