# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-06-001
date: 2026-09-06
status: candidate
symptom: 리뷰 목적으로 held-out 세트를 읽은 뒤 하네스를 바꿔 그 세트를 오염시켰습니다. 금지 지시는 두 곳에 있었으나 아무것도 막거나 알리지 않았고, 오염 사실은 한참 뒤 회고로 드러났습니다.
evidence: 2026-09-06 세션. CLAUDE.md 의 저장소 지도가 held-out 은 승격 판정 때만 연다고 적었고, 세트 문서 첫 문단도 같은 순서를 금지합니다. 그런데 리뷰를 요청받은 에이전트가 저장소 전수 조사 중 그 파일을 전문 읽었고 이어서 여덟 커밋의 하네스 변경을 수행했습니다. 읽기를 감지하거나 경고하는 수단이 없어 오염이 발생한 사실 자체가 세션 후반의 회고에서야 드러났습니다. 결과로 2026-09-05-003 의 held-out 판정을 같은 세션에서 할 수 없게 되었고, 그 candidate 는 validating 에 묶였습니다.
root_cause: 오염 방지가 자연어 지시로만 존재합니다. 가드는 Edit 와 Write 와 Bash 만 가로채고 Read 는 보지 않으므로, 읽기만으로 성립하는 오염에는 관측 수단이 아예 없습니다. 더해서 세트가 저장소 안에 있어 전수 조사와 문서 링크 검사 대상에 자연스럽게 포함되고, 읽지 않는 것이 기본값이 아니라 예외가 됩니다.
fix: 아직 고치지 않았습니다. 후보 셋. 첫째 PreToolUse 에 Read matcher 를 더해 held-out 경로를 읽을 때 지금이 승격 판정 시점인지 묻는 경고를 내고 감사 기록에 남깁니다. 둘째 세트를 저장소 밖이나 별도 브랜치로 옮겨 일상 조사에 걸리지 않게 합니다. 셋째 오염 시 세트를 교체하는 절차를 평가 세트 운용 문서에 명문화합니다. 첫째와 셋째는 함께 갈 수 있습니다.
recurrence_risk: high
harness_element: HE-14
proposed_harness_change: 읽는 것만으로 무효가 되는 자산은 읽기를 관측할 수 있어야 합니다. 금지를 자연어 지시로만 두지 않고 최소한 읽었다는 사실이 기록에 남게 합니다. 관측할 수 없는 금지는 지켜졌는지 확인할 수 없고, 확인할 수 없는 것은 게이트가 아닙니다.
preferred_enforcement: hook
trust: untrusted
regression_check: 대상 REP-3 과 held-out 세트 전체. 기준 넷. 하나, held-out 경로를 읽으면 경고가 나오고 감사 기록에 남을 것. 둘, 무관한 파일 읽기는 조용할 것. 셋, 가드 1회 실행이 1초 예산 안일 것. 넷, 승격 판정 시점의 정당한 읽기를 차단하지 않을 것. 하나라도 어긋나면 기각합니다. 판정 근거는 실행 기록 디렉터리에 남깁니다.
owner: unassigned
expires: 2026-12-31
